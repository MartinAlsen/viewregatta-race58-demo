<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Race 58">
  <link rel="manifest" href="./race58.webmanifest">
  <link rel="apple-touch-icon" href="./race58-icon.png">
  <title>Race 58 · ViewRegatta</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b10;color-scheme:dark}
    iframe{display:block;border:0;width:100%;height:100%;height:100dvh;position:absolute;top:0;left:0}
  </style>
</head>
<body>
  <iframe title="Race 58 · Interaktiv spelare" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <script>
    const frame = document.querySelector('iframe');
    function fitPlayerFrame() {
      const view = window.visualViewport;
      if (view && view.scale !== 1) return;
      const width = view?.width ?? window.innerWidth;
      const height = view?.height ?? window.innerHeight;
      frame.style.width = width + 'px';
      frame.style.height = height + 'px';
      frame.style.left = (view?.pageLeft ?? 0) + 'px';
      frame.style.top = (view?.pageTop ?? 0) + 'px';
    }
    fitPlayerFrame();
    window.addEventListener('resize', fitPlayerFrame);
    window.visualViewport?.addEventListener('resize', fitPlayerFrame);
    window.visualViewport?.addEventListener('scroll', fitPlayerFrame);
    const player = new URL('https://martinalsen.github.io/viewregatta-race58-demo/race58-player/');
    player.search = location.search;
    player.searchParams.set('viewer', '2e68f8ca3234');
    player.hash = location.hash;
    document.querySelector('iframe').src = player.href;
  </script>
  <noscript><a href="../index.html">Se Race 58</a></noscript>
</body>
</html>
